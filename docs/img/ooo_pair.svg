<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 355" width="980" height="355" class="chart" role="img" aria-label="Two instructions per cycle: what the second slot may do"><style>.chart{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--n:#898781;--box:#f3f2ee;--tint:#e4eefb;--band:#f8f7f4;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#0d366b;font-family:system-ui, -apple-system, "Segoe UI", sans-serif}@media (prefers-color-scheme:dark){.chart{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--n:#898781;--box:#262624;--tint:#172a44;--band:#1f1f1e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#86b6ef;--o5:#cde2fb;}}.bg{fill:var(--surface)}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.mark{stroke:var(--ink2);stroke-width:1}.ring{stroke:var(--surface);stroke-width:2}.box{fill:var(--box);stroke:var(--axis);stroke-width:1}.box-a{fill:var(--tint);stroke:var(--s1);stroke-width:1.5}.band{fill:var(--band);stroke:var(--grid);stroke-width:1}.wire{stroke:var(--ink2);stroke-width:1.5;fill:none;stroke-linejoin:round}.bus{stroke:var(--s1);stroke-width:3;fill:none}.head{fill:var(--ink2)}.head-a{fill:var(--s1)}.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}.t-ink{fill:var(--ink)}.t-ink2{fill:var(--ink2)}.t-muted{fill:var(--muted)}.f-n{fill:var(--n)}.k-n{stroke:var(--n);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s5{fill:var(--s5)}.k-s5{stroke:var(--s5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s6{fill:var(--s6)}.k-s6{stroke:var(--s6);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s7{fill:var(--s7)}.k-s7{stroke:var(--s7);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s8{fill:var(--s8)}.k-s8{stroke:var(--s8);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o1{fill:var(--o1)}.k-o1{stroke:var(--o1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o2{fill:var(--o2)}.k-o2{stroke:var(--o2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o3{fill:var(--o3)}.k-o3{stroke:var(--o3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o4{fill:var(--o4)}.k-o4{stroke:var(--o4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o5{fill:var(--o5)}.k-o5{stroke:var(--o5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="8" class="bg"/><text x="20" y="33" font-size="15" text-anchor="start" class="t-ink" font-weight="600">Two instructions per cycle: what the second slot may do</text><text x="20" y="55" font-size="12" text-anchor="start" class="t-ink2">Every stage handles a pair. Almost all of the work in going wide is deciding when the second of a pair has to wait a cycle.</text><g transform="translate(20,69)"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head"/></marker><marker id="head-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head-a"/></marker></defs><rect x="110" y="24" width="180" height="50" rx="6" class="box"/><text x="200" y="45.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Fetch</text><text x="200" y="60.5" font-size="11" text-anchor="middle" class="t-ink2">the instruction at pc</text><rect x="110" y="94" width="180" height="50" rx="6" class="box-a"/><text x="200" y="115.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Fetch</text><text x="200" y="130.5" font-size="11" text-anchor="middle" class="t-ink2">pc + 4, same cache access</text><rect x="315" y="24" width="180" height="50" rx="6" class="box"/><text x="405" y="45.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Rename, dispatch</text><text x="405" y="60.5" font-size="11" text-anchor="middle" class="t-ink2">sources from the rename table</text><rect x="315" y="94" width="180" height="50" rx="6" class="box-a"/><text x="405" y="115.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Rename, dispatch</text><text x="405" y="130.5" font-size="11" text-anchor="middle" class="t-ink2">also sees slot 0's write</text><path d="M290,49 L315,49" class="wire" marker-end="url(#head)"/><path d="M290,119 L315,119" class="wire" marker-end="url(#head)"/><rect x="520" y="24" width="180" height="50" rx="6" class="box"/><text x="610" y="45.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Execute</text><text x="610" y="60.5" font-size="11" text-anchor="middle" class="t-ink2">the oldest ready station</text><rect x="520" y="94" width="180" height="50" rx="6" class="box-a"/><text x="610" y="115.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Execute</text><text x="610" y="130.5" font-size="11" text-anchor="middle" class="t-ink2">the next oldest; a second bus</text><path d="M495,49 L520,49" class="wire" marker-end="url(#head)"/><path d="M495,119 L520,119" class="wire" marker-end="url(#head)"/><rect x="725" y="24" width="180" height="50" rx="6" class="box"/><text x="815" y="45.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Retire</text><text x="815" y="60.5" font-size="11" text-anchor="middle" class="t-ink2">the head of the reorder buffer</text><rect x="725" y="94" width="180" height="50" rx="6" class="box-a"/><text x="815" y="115.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Retire</text><text x="815" y="130.5" font-size="11" text-anchor="middle" class="t-ink2">the entry behind the head</text><path d="M700,49 L725,49" class="wire" marker-end="url(#head)"/><path d="M700,119 L725,119" class="wire" marker-end="url(#head)"/><path d="M405,74 L405,94" class="wire" marker-end="url(#head)"/><text x="20" y="46" font-size="12" text-anchor="start" class="t-ink halo" font-weight="600">slot 0</text><text x="20" y="62" font-size="11" text-anchor="start" class="t-muted halo">the older</text><text x="20" y="116" font-size="12" text-anchor="start" class="t-ink halo" font-weight="600">slot 1</text><text x="20" y="132" font-size="11" text-anchor="start" class="t-muted halo">width 2 only</text><text x="20" y="188" font-size="11" text-anchor="start" class="t-ink2 halo">slot 1 stays</text><text x="20" y="204" font-size="11" text-anchor="start" class="t-ink2 halo">behind when</text><text x="200" y="188" font-size="11" text-anchor="middle" class="t-ink2 halo">slot 0 is predicted taken,</text><text x="200" y="204" font-size="11" text-anchor="middle" class="t-ink2 halo">or is the last in its line</text><text x="405" y="188" font-size="11" text-anchor="middle" class="t-ink2 halo">there is no room for two,</text><text x="405" y="204" font-size="11" text-anchor="middle" class="t-ink2 halo">or it is a system instruction</text><text x="610" y="188" font-size="11" text-anchor="middle" class="t-ink2 halo">a load completes this cycle</text><text x="610" y="204" font-size="11" text-anchor="middle" class="t-ink2 halo">and takes the second bus</text><text x="815" y="188" font-size="11" text-anchor="middle" class="t-ink2 halo">it is a store or a system</text><text x="815" y="204" font-size="11" text-anchor="middle" class="t-ink2 halo">instruction, it trapped, or</text><text x="815" y="220" font-size="11" text-anchor="middle" class="t-ink2 halo">the head was mispredicted</text><text x="110" y="254" font-size="11" text-anchor="start" class="t-muted halo">At width 1 the second slot is never used: the same RTL with one parameter changed.</text></g></svg>
