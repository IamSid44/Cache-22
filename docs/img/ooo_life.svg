<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 439" width="980" height="439" class="chart" role="img" aria-label="The life of an instruction in the out-of-order core"><style>.chart{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--n:#898781;--box:#f3f2ee;--tint:#e4eefb;--band:#f8f7f4;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#0d366b;font-family:system-ui, -apple-system, "Segoe UI", sans-serif}@media (prefers-color-scheme:dark){.chart{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--n:#898781;--box:#262624;--tint:#172a44;--band:#1f1f1e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#86b6ef;--o5:#cde2fb;}}.bg{fill:var(--surface)}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.mark{stroke:var(--ink2);stroke-width:1}.ring{stroke:var(--surface);stroke-width:2}.box{fill:var(--box);stroke:var(--axis);stroke-width:1}.box-a{fill:var(--tint);stroke:var(--s1);stroke-width:1.5}.band{fill:var(--band);stroke:var(--grid);stroke-width:1}.wire{stroke:var(--ink2);stroke-width:1.5;fill:none;stroke-linejoin:round}.bus{stroke:var(--s1);stroke-width:3;fill:none}.head{fill:var(--ink2)}.head-a{fill:var(--s1)}.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}.t-ink{fill:var(--ink)}.t-ink2{fill:var(--ink2)}.t-muted{fill:var(--muted)}.f-n{fill:var(--n)}.k-n{stroke:var(--n);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s5{fill:var(--s5)}.k-s5{stroke:var(--s5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s6{fill:var(--s6)}.k-s6{stroke:var(--s6);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s7{fill:var(--s7)}.k-s7{stroke:var(--s7);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s8{fill:var(--s8)}.k-s8{stroke:var(--s8);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o1{fill:var(--o1)}.k-o1{stroke:var(--o1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o2{fill:var(--o2)}.k-o2{stroke:var(--o2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o3{fill:var(--o3)}.k-o3{stroke:var(--o3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o4{fill:var(--o4)}.k-o4{stroke:var(--o4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o5{fill:var(--o5)}.k-o5{stroke:var(--o5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="8" class="bg"/><text x="20" y="33" font-size="15" text-anchor="start" class="t-ink" font-weight="600">The life of an instruction in the out-of-order core</text><text x="20" y="55" font-size="12" text-anchor="start" class="t-ink2">Five steps, and the indirection that makes them work: nothing is ever searched for by register number once an instruction has been renamed.</text><g transform="translate(20,69)"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head"/></marker><marker id="head-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head-a"/></marker></defs><rect x="12" y="160" width="916" height="176" rx="8" class="band"/><text x="22" y="176" font-size="11" text-anchor="start" class="t-muted">one number links a producer to its consumers: the tag is the producer's ROB entry</text><rect x="748" y="16" width="180" height="124" rx="8" class="band"/><text x="758" y="32" font-size="11" text-anchor="start" class="t-muted">in program order</text><rect x="196" y="16" width="548" height="124" rx="8" class="band"/><text x="206" y="32" font-size="11" text-anchor="start" class="t-muted">out of order</text><rect x="12" y="16" width="180" height="124" rx="8" class="band"/><text x="22" y="32" font-size="11" text-anchor="start" class="t-muted">in program order</text><rect x="20" y="44" width="164" height="86" rx="6" class="box"/><text x="102" y="68.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">1. Dispatch</text><text x="102" y="83.5" font-size="11" text-anchor="middle" class="t-ink2">gets the next ROB entry;</text><text x="102" y="98.5" font-size="11" text-anchor="middle" class="t-ink2">sources: the value,</text><text x="102" y="113.5" font-size="11" text-anchor="middle" class="t-ink2">or a tag to wait for</text><rect x="204" y="44" width="164" height="86" rx="6" class="box"/><text x="286" y="68.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">2. Wait</text><text x="286" y="83.5" font-size="11" text-anchor="middle" class="t-ink2">in a reservation station,</text><text x="286" y="98.5" font-size="11" text-anchor="middle" class="t-ink2">watching the bus</text><text x="286" y="113.5" font-size="11" text-anchor="middle" class="t-ink2">for its tags</text><path d="M184,87 L204,87" class="wire" marker-end="url(#head)"/><rect x="388" y="44" width="164" height="86" rx="6" class="box-a"/><text x="470" y="68.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">3. Execute</text><text x="470" y="83.5" font-size="11" text-anchor="middle" class="t-ink2">oldest ready goes first;</text><text x="470" y="98.5" font-size="11" text-anchor="middle" class="t-ink2">result on the bus</text><text x="470" y="113.5" font-size="11" text-anchor="middle" class="t-ink2">in the same cycle</text><path d="M368,87 L388,87" class="wire" marker-end="url(#head)"/><rect x="572" y="44" width="164" height="86" rx="6" class="box"/><text x="654" y="68.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">4. Complete</text><text x="654" y="83.5" font-size="11" text-anchor="middle" class="t-ink2">result stored in</text><text x="654" y="98.5" font-size="11" text-anchor="middle" class="t-ink2">its ROB entry,</text><text x="654" y="113.5" font-size="11" text-anchor="middle" class="t-ink2">marked done</text><path d="M552,87 L572,87" class="wire" marker-end="url(#head)"/><rect x="756" y="44" width="164" height="86" rx="6" class="box"/><text x="838" y="68.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">5. Retire</text><text x="838" y="83.5" font-size="11" text-anchor="middle" class="t-ink2">at the ROB head:</text><text x="838" y="98.5" font-size="11" text-anchor="middle" class="t-ink2">register, memory</text><text x="838" y="113.5" font-size="11" text-anchor="middle" class="t-ink2">or trap</text><path d="M736,87 L756,87" class="wire" marker-end="url(#head)"/><rect x="30" y="238" width="190" height="62" rx="6" class="box"/><text x="125" y="258" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Rename table</text><text x="125" y="273" font-size="11" text-anchor="middle" class="t-ink2">a0 is being computed</text><text x="125" y="288" font-size="11" text-anchor="middle" class="t-ink2">by entry 5</text><rect x="250" y="238" width="200" height="62" rx="6" class="box"/><text x="350" y="258" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Reservation station</text><text x="350" y="273" font-size="11" text-anchor="middle" class="t-ink2">sub: one operand waits</text><text x="350" y="288" font-size="11" text-anchor="middle" class="t-ink2">for tag 5</text><rect x="480" y="238" width="190" height="62" rx="6" class="box-a"/><text x="575" y="265.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Common data bus</text><text x="575" y="280.5" font-size="11" text-anchor="middle" class="t-ink2">tag 5 + the value</text><rect x="700" y="238" width="210" height="62" rx="6" class="box"/><text x="805" y="258" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Reorder buffer</text><text x="805" y="273" font-size="11" text-anchor="middle" class="t-ink2">entry 5: value, done;</text><text x="805" y="288" font-size="11" text-anchor="middle" class="t-ink2">at the head: a0 written</text><path d="M220,269 L250,269" class="wire" marker-end="url(#head)"/><path d="M480,269 L450,269" class="wire" marker-end="url(#head)"/><path d="M670,269 L700,269" class="wire" marker-end="url(#head)"/><text x="30" y="202" font-size="11" text-anchor="start" class="t-ink2 halo">Example:  add a0, a1, a2  is in ROB entry 5;  sub a3, a0, a4  comes after it and reads a0.</text><text x="125" y="230" font-size="11" text-anchor="middle" class="t-muted halo">add is dispatched</text><text x="350" y="230" font-size="11" text-anchor="middle" class="t-muted halo">sub is dispatched</text><text x="575" y="230" font-size="11" text-anchor="middle" class="t-muted halo">add executes</text><text x="805" y="230" font-size="11" text-anchor="middle" class="t-muted halo">add completes, then retires</text><text x="350" y="320" font-size="11" text-anchor="middle" class="t-ink2 halo">captures the value when the tag on the bus matches its own</text></g></svg>
