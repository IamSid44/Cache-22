<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 449" width="980" height="449" class="chart" role="img" aria-label="The out-of-order core"><style>.chart{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--n:#898781;--box:#f3f2ee;--tint:#e4eefb;--band:#f8f7f4;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#0d366b;font-family:system-ui, -apple-system, "Segoe UI", sans-serif}@media (prefers-color-scheme:dark){.chart{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--n:#898781;--box:#262624;--tint:#172a44;--band:#1f1f1e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#86b6ef;--o5:#cde2fb;}}.bg{fill:var(--surface)}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.mark{stroke:var(--ink2);stroke-width:1}.ring{stroke:var(--surface);stroke-width:2}.box{fill:var(--box);stroke:var(--axis);stroke-width:1}.box-a{fill:var(--tint);stroke:var(--s1);stroke-width:1.5}.band{fill:var(--band);stroke:var(--grid);stroke-width:1}.wire{stroke:var(--ink2);stroke-width:1.5;fill:none;stroke-linejoin:round}.bus{stroke:var(--s1);stroke-width:3;fill:none}.head{fill:var(--ink2)}.head-a{fill:var(--s1)}.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}.t-ink{fill:var(--ink)}.t-ink2{fill:var(--ink2)}.t-muted{fill:var(--muted)}.f-n{fill:var(--n)}.k-n{stroke:var(--n);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s5{fill:var(--s5)}.k-s5{stroke:var(--s5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s6{fill:var(--s6)}.k-s6{stroke:var(--s6);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s7{fill:var(--s7)}.k-s7{stroke:var(--s7);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s8{fill:var(--s8)}.k-s8{stroke:var(--s8);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o1{fill:var(--o1)}.k-o1{stroke:var(--o1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o2{fill:var(--o2)}.k-o2{stroke:var(--o2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o3{fill:var(--o3)}.k-o3{stroke:var(--o3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o4{fill:var(--o4)}.k-o4{stroke:var(--o4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o5{fill:var(--o5)}.k-o5{stroke:var(--o5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="8" class="bg"/><text x="20" y="33" font-size="15" text-anchor="start" class="t-ink" font-weight="600">The out-of-order core</text><text x="20" y="55" font-size="12" text-anchor="start" class="t-ink2">Tomasulo's algorithm with a reorder buffer. Instructions enter and leave in program order; in between each runs when its operands are ready.</text><g transform="translate(20,69)"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head"/></marker><marker id="head-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head-a"/></marker></defs><rect x="340" y="206" width="580" height="136" rx="8" class="band"/><text x="350" y="222" font-size="11" text-anchor="start" class="t-muted">in program order again</text><rect x="340" y="16" width="480" height="170" rx="8" class="band"/><text x="350" y="32" font-size="11" text-anchor="start" class="t-muted">out of order</text><rect x="20" y="16" width="300" height="250" rx="8" class="band"/><text x="30" y="32" font-size="11" text-anchor="start" class="t-muted">in program order</text><rect x="40" y="100" width="110" height="60" rx="6" class="box"/><text x="95" y="119" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Fetch</text><text x="95" y="134" font-size="11" text-anchor="middle" class="t-ink2">2 per cycle</text><text x="95" y="149" font-size="11" text-anchor="middle" class="t-ink2">predictor</text><rect x="180" y="100" width="120" height="60" rx="6" class="box-a"/><text x="240" y="119" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Rename</text><text x="240" y="134" font-size="11" text-anchor="middle" class="t-ink2">register → tag</text><text x="240" y="149" font-size="11" text-anchor="middle" class="t-ink2">dispatch</text><path d="M150,130 L180,130" class="wire" marker-end="url(#head)"/><rect x="370" y="66" width="160" height="50" rx="6" class="box-a"/><text x="450" y="87.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Reservation stations</text><text x="450" y="102.5" font-size="11" text-anchor="middle" class="t-ink2">oldest ready goes first</text><rect x="370" y="126" width="160" height="50" rx="6" class="box-a"/><text x="450" y="147.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Load/store queue</text><text x="450" y="162.5" font-size="11" text-anchor="middle" class="t-ink2">loads wait for older stores</text><rect x="570" y="66" width="120" height="50" rx="6" class="box"/><text x="630" y="87.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">2 ALUs</text><text x="630" y="102.5" font-size="11" text-anchor="middle" class="t-ink2">branches decided</text><rect x="570" y="126" width="120" height="50" rx="6" class="box"/><text x="630" y="147.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Data cache</text><text x="630" y="162.5" font-size="11" text-anchor="middle" class="t-ink2">1 load per cycle</text><path d="M300,120 L336,120 L336,91 L370,91" class="wire" marker-end="url(#head)"/><path d="M300,142 L336,142 L336,151 L370,151" class="wire" marker-end="url(#head)"/><path d="M530,91 L570,91" class="wire" marker-end="url(#head)"/><path d="M530,151 L570,151" class="wire" marker-end="url(#head)"/><path d="M690,91 L720,91" class="wire"/><path d="M690,151 L720,151" class="wire"/><path d="M720,48 L720,238" class="bus" marker-end="url(#head-a)"/><path d="M720,48 L450,48 L450,66" class="wire" marker-end="url(#head)"/><rect x="370" y="238" width="400" height="56" rx="6" class="box-a"/><text x="570" y="262.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Reorder buffer</text><text x="570" y="277.5" font-size="11" text-anchor="middle" class="t-ink2">one entry per instruction in flight, oldest at the head</text><path d="M240,160 L240,266 L370,266" class="wire" marker-end="url(#head)"/><rect x="800" y="238" width="110" height="56" rx="6" class="box"/><text x="855" y="255" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Retire</text><text x="855" y="270" font-size="11" text-anchor="middle" class="t-ink2">registers,</text><text x="855" y="285" font-size="11" text-anchor="middle" class="t-ink2">memory, CSRs</text><path d="M770,266 L800,266" class="wire" marker-end="url(#head)"/><path d="M855,294 L855,322 L95,322 L95,160" class="wire" marker-end="url(#head)"/><text x="730" y="116" font-size="11" text-anchor="start" class="t-ink2 halo">result + tag</text><text x="730" y="131" font-size="11" text-anchor="start" class="t-muted halo">common</text><text x="730" y="146" font-size="11" text-anchor="start" class="t-muted halo">data bus</text><text x="585" y="42" font-size="11" text-anchor="middle" class="t-ink2 halo">wake up whoever waits for this tag</text><text x="248" y="258" font-size="11" text-anchor="start" class="t-ink2 halo">allocate</text><text x="356" y="316" font-size="11" text-anchor="start" class="t-ink2 halo">wrong path or trap, found at the head: discard everything younger, refetch</text></g></svg>
