<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 485" width="980" height="485" class="chart" role="img" aria-label="Inside the cache: what happens to one access"><style>.chart{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--n:#898781;--box:#f3f2ee;--tint:#e4eefb;--band:#f8f7f4;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#0d366b;font-family:system-ui, -apple-system, "Segoe UI", sans-serif}@media (prefers-color-scheme:dark){.chart{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--n:#898781;--box:#262624;--tint:#172a44;--band:#1f1f1e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#86b6ef;--o5:#cde2fb;}}.bg{fill:var(--surface)}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.mark{stroke:var(--ink2);stroke-width:1}.ring{stroke:var(--surface);stroke-width:2}.box{fill:var(--box);stroke:var(--axis);stroke-width:1}.box-a{fill:var(--tint);stroke:var(--s1);stroke-width:1.5}.band{fill:var(--band);stroke:var(--grid);stroke-width:1}.wire{stroke:var(--ink2);stroke-width:1.5;fill:none;stroke-linejoin:round}.bus{stroke:var(--s1);stroke-width:3;fill:none}.head{fill:var(--ink2)}.head-a{fill:var(--s1)}.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}.t-ink{fill:var(--ink)}.t-ink2{fill:var(--ink2)}.t-muted{fill:var(--muted)}.f-n{fill:var(--n)}.k-n{stroke:var(--n);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s5{fill:var(--s5)}.k-s5{stroke:var(--s5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s6{fill:var(--s6)}.k-s6{stroke:var(--s6);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s7{fill:var(--s7)}.k-s7{stroke:var(--s7);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s8{fill:var(--s8)}.k-s8{stroke:var(--s8);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o1{fill:var(--o1)}.k-o1{stroke:var(--o1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o2{fill:var(--o2)}.k-o2{stroke:var(--o2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o3{fill:var(--o3)}.k-o3{stroke:var(--o3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o4{fill:var(--o4)}.k-o4{stroke:var(--o4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o5{fill:var(--o5)}.k-o5{stroke:var(--o5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="8" class="bg"/><text x="20" y="33" font-size="15" text-anchor="start" class="t-ink" font-weight="600">Inside the cache: what happens to one access</text><text x="20" y="55" font-size="12" text-anchor="start" class="t-ink2">One module serves as instruction cache, data cache and second-level cache. Each box in the lower row is a parameter and can be left out.</text><g transform="translate(20,69)"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head"/></marker><marker id="head-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head-a"/></marker></defs><rect x="80" y="28" width="260" height="34" rx="6" class="box"/><text x="210" y="49" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">tag</text><rect x="340" y="28" width="150" height="34" rx="6" class="box"/><text x="415" y="49" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">set index</text><rect x="490" y="28" width="120" height="34" rx="6" class="box"/><text x="550" y="49" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">byte offset</text><rect x="250" y="100" width="240" height="70" rx="6" class="box-a"/><text x="370" y="131.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">One set: WAYS lines</text><text x="370" y="146.5" font-size="11" text-anchor="middle" class="t-ink2">each: valid, dirty, tag, 32 bytes</text><path d="M415,62 L415,100" class="wire" marker-end="url(#head)"/><path d="M160,62 L160,135 L250,135" class="wire" marker-end="url(#head)"/><rect x="600" y="100" width="320" height="70" rx="6" class="box"/><text x="760" y="124" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Hit: answered in the same cycle</text><text x="760" y="139" font-size="11" text-anchor="middle" class="t-ink2">a store marks the line dirty (write-back)</text><text x="760" y="154" font-size="11" text-anchor="middle" class="t-ink2">or also goes to memory (write-through)</text><path d="M490,135 L600,135" class="wire" marker-end="url(#head)"/><rect x="30" y="220" width="180" height="70" rx="6" class="box"/><text x="120" y="244" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Victim buffer</text><text x="120" y="259" font-size="11" text-anchor="middle" class="t-ink2">has the line? swap: 1 cycle.</text><text x="120" y="274" font-size="11" text-anchor="middle" class="t-ink2">It also takes evicted lines</text><rect x="255" y="220" width="200" height="70" rx="6" class="box-a"/><text x="355" y="244" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Choose a victim</text><text x="355" y="259" font-size="11" text-anchor="middle" class="t-ink2">an empty way, else by policy:</text><text x="355" y="274" font-size="11" text-anchor="middle" class="t-ink2">LRU, FIFO, random, pseudo-LRU</text><rect x="500" y="220" width="180" height="70" rx="6" class="box"/><text x="590" y="244" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Write buffer</text><text x="590" y="259" font-size="11" text-anchor="middle" class="t-ink2">a dirty line that leaves is</text><text x="590" y="274" font-size="11" text-anchor="middle" class="t-ink2">queued, or written back first</text><rect x="720" y="220" width="200" height="70" rx="6" class="box"/><text x="820" y="244" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Fetch the line</text><text x="820" y="259" font-size="11" text-anchor="middle" class="t-ink2">next level's latency + 2 cycles;</text><text x="820" y="274" font-size="11" text-anchor="middle" class="t-ink2">other lines still answer</text><path d="M370,170 L370,200 L120,200 L120,220" class="wire" marker-end="url(#head)"/><path d="M210,255 L255,255" class="wire" marker-end="url(#head)"/><path d="M455,255 L500,255" class="wire" marker-end="url(#head)"/><path d="M680,255 L720,255" class="wire" marker-end="url(#head)"/><path d="M820,220 L820,200 L470,200 L470,170" class="wire" marker-end="url(#head)"/><rect x="720" y="330" width="200" height="56" rx="6" class="box"/><text x="820" y="347" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Prefetcher</text><text x="820" y="362" font-size="11" text-anchor="middle" class="t-ink2">next line or stride:</text><text x="820" y="377" font-size="11" text-anchor="middle" class="t-ink2">lines nobody waits for yet</text><path d="M820,330 L820,290" class="wire" marker-end="url(#head)"/><text x="70" y="49" font-size="11" text-anchor="end" class="t-muted halo">address</text><text x="423" y="85" font-size="11" text-anchor="start" class="t-ink2 halo">selects the set</text><text x="168" y="128" font-size="11" text-anchor="start" class="t-ink2 halo">compare tags</text><text x="545" y="129" font-size="11" text-anchor="middle" class="t-ink2 halo">match</text><text x="245" y="194" font-size="11" text-anchor="middle" class="t-ink2 halo">no match: a miss</text><text x="232" y="248" font-size="11" text-anchor="middle" class="t-ink2 halo">no</text><text x="650" y="194" font-size="11" text-anchor="middle" class="t-ink2 halo">install as most recently used</text><text x="30" y="352" font-size="11" text-anchor="start" class="t-muted halo">Every access and eviction is written to an event log,</text><text x="30" y="368" font-size="11" text-anchor="start" class="t-muted halo">and a model of the policies must agree with each one.</text></g></svg>
