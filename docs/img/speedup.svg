oin:round;stroke-linecap:round}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s5{fill:var(--s5)}.k-s5{stroke:var(--s5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s6{fill:var(--s6)}.k-s6{stroke:var(--s6);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s7{fill:var(--s7)}.k-s7{stroke:var(--s7);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s8{fill:var(--s8)}.k-s8{stroke:var(--s8);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o1{fill:var(--o1)}.k-o1{stroke:var(--o1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o2{fill:var(--o2)}.k-o2{stroke:var(--o2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o3{fill:var(--o3)}.k-o3{stroke:var(--o3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o4{fill:var(--o4)}.k-o4{stroke:var(--o4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o5{fill:var(--o5)}.k-o5{stroke:var(--o5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="8" class="bg"/><text x="20" y="33" font-size="15" text-anchor="start" class="t-ink" font-weight="600">What each step bought</text><text x="20" y="55" font-size="12" text-anchor="start" class="t-ink2">Speed relative to the same pipeline with a 10-cycle memory and no caches. Geometric mean over 15 kernels,</text><text x="20" y="72" font-size="12" text-anchor="start" class="t-ink2">measured in clock cycles in RTL simulation; every run also matched the golden model instruction for instruction.</text><g transform="translate(20,86)"><line x1="339.3" x2="339.3" y1="8" y2="158" class="axis"/><text x="339.3" y="174" font-size="11" text-anchor="middle" class="t-muted">0x</text><line x1="452.7" x2="452.7" y1="8" y2="158" class="grid"/><text x="452.7" y="174" font-size="11" text-anchor="middle" class="t-muted">5x</text><line x1="566.2" x2="566.2" y1="8" y2="158" class="grid"/><text x="566.2" y="174" font-size="11" text-anchor="middle" class="t-muted">10x</text><line x1="679.7" x2="679.7" y1="8" y2="158" class="grid"/><text x="679.7" y="174" font-size="11" text-anchor="middle" class="t-muted">15x</text><text x="509.5" y="194" font-size="11" text-anchor="middle" class="t-muted">Times faster than the machine without caches</text><path d="M339.3,14 H358 Q362,14 362,18 V28 Q362,32 358,32 H339.3 Z" class="f-n"><title>No caches: memory is 10 cycles away: 1.0x</title></path><text x="331.3" y="27" font-size="12" text-anchor="end" class="t-ink2">No caches: memory is 10 cycles away</text><path d="M339.3,44 H471.3 Q475.3,44 475.3,48 V58 Q475.3,62 471.3,62 H339.3 Z" class="f-s1"><title>+ instruction and data caches: 6.0x</title></path><text x="331.3" y="57" font-size="12" text-anchor="end" class="t-ink2">+ instruction and data caches</text><path d="M339.3,74 H544.7 Q548.7,74 548.7,78 V88 Q548.7,92 544.7,92 H339.3 Z" class="f-s1"><title>+ second cache way, branch predictor, prefetchers: 9.2x</title></path><text x="331.3" y="87" font-size="12" text-anchor="end" class="t-ink2">+ second cache way, branch predictor, prefetchers</text><path d="M339.3,104 H550.3 Q554.3,104 554.3,108 V118 Q554.3,122 550.3,122 H339.3 Z" class="f-s1"><title>+ out-of-order execution: 9.5x</title></path><text x="331.3" y="117" font-size="12" text-anchor="end" class="t-ink2">+ out-of-order execution</text><path d="M339.3,134 H603 Q607,134 607,138 V148 Q607,152 603,152 H339.3 Z" class="f-s1"><title>+ two instructions per cycle: 11.8x</title></path><text x="331.3" y="147" font-size="12" text-anchor="end" class="t-ink2">+ two instructions per cycle</text><text x="368" y="27" font-size="11" text-anchor="start" class="t-ink halo" font-weight="600">1.0x</text><text x="404.9" y="27" font-size="11" text-anchor="start" class="t-muted halo">the starting point</text><text x="481.3" y="57" font-size="11" text-anchor="st