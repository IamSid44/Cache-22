<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 445" width="980" height="445" class="chart" role="img" aria-label="The branch predictor"><style>.chart{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--n:#898781;--box:#f3f2ee;--tint:#e4eefb;--band:#f8f7f4;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#0d366b;font-family:system-ui, -apple-system, "Segoe UI", sans-serif}@media (prefers-color-scheme:dark){.chart{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--n:#898781;--box:#262624;--tint:#172a44;--band:#1f1f1e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#86b6ef;--o5:#cde2fb;}}.bg{fill:var(--surface)}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.mark{stroke:var(--ink2);stroke-width:1}.ring{stroke:var(--surface);stroke-width:2}.box{fill:var(--box);stroke:var(--axis);stroke-width:1}.box-a{fill:var(--tint);stroke:var(--s1);stroke-width:1.5}.band{fill:var(--band);stroke:var(--grid);stroke-width:1}.wire{stroke:var(--ink2);stroke-width:1.5;fill:none;stroke-linejoin:round}.bus{stroke:var(--s1);stroke-width:3;fill:none}.head{fill:var(--ink2)}.head-a{fill:var(--s1)}.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}.t-ink{fill:var(--ink)}.t-ink2{fill:var(--ink2)}.t-muted{fill:var(--muted)}.f-n{fill:var(--n)}.k-n{stroke:var(--n);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s5{fill:var(--s5)}.k-s5{stroke:var(--s5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s6{fill:var(--s6)}.k-s6{stroke:var(--s6);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s7{fill:var(--s7)}.k-s7{stroke:var(--s7);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s8{fill:var(--s8)}.k-s8{stroke:var(--s8);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o1{fill:var(--o1)}.k-o1{stroke:var(--o1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o2{fill:var(--o2)}.k-o2{stroke:var(--o2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o3{fill:var(--o3)}.k-o3{stroke:var(--o3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o4{fill:var(--o4)}.k-o4{stroke:var(--o4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o5{fill:var(--o5)}.k-o5{stroke:var(--o5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="8" class="bg"/><text x="20" y="33" font-size="15" text-anchor="start" class="t-ink" font-weight="600">The branch predictor</text><text x="20" y="55" font-size="12" text-anchor="start" class="t-ink2">A branch target buffer with a 2-bit counter per entry. A wrong answer costs cycles, never correctness: the core checks every prediction.</text><g transform="translate(20,69)"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head"/></marker><marker id="head-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head-a"/></marker></defs><rect x="20" y="244" width="900" height="100" rx="8" class="band"/><text x="30" y="260" font-size="11" text-anchor="start" class="t-muted">the 2-bit counter of one entry</text><rect x="20" y="16" width="900" height="216" rx="8" class="band"/><text x="30" y="32" font-size="11" text-anchor="start" class="t-muted">at fetch, from the pc alone</text><rect x="40" y="68" width="50" height="34" rx="6" class="box"/><text x="65" y="89" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">pc</text><rect x="140" y="50" width="250" height="70" rx="6" class="box-a"/><text x="265" y="74" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Table: 64 entries</text><text x="265" y="89" font-size="11" text-anchor="middle" class="t-ink2">indexed by low pc bits; each entry:</text><text x="265" y="104" font-size="11" text-anchor="middle" class="t-ink2">valid | tag | target | 2-bit counter</text><path d="M90,85 L140,85" class="wire" marker-end="url(#head)"/><rect x="470" y="50" width="190" height="70" rx="6" class="box"/><text x="565" y="66.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Next pc</text><text x="565" y="81.5" font-size="11" text-anchor="middle" class="t-ink2">target, if the tag matches</text><text x="565" y="96.5" font-size="11" text-anchor="middle" class="t-ink2">and the counter is 2 or 3;</text><text x="565" y="111.5" font-size="11" text-anchor="middle" class="t-ink2">otherwise pc + 4</text><path d="M390,85 L470,85" class="wire" marker-end="url(#head)"/><rect x="140" y="160" width="250" height="60" rx="6" class="box"/><text x="265" y="179" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Train</text><text x="265" y="194" font-size="11" text-anchor="middle" class="t-ink2">with what really happened, from EX</text><text x="265" y="209" font-size="11" text-anchor="middle" class="t-ink2">(out-of-order core: at retirement)</text><path d="M265,160 L265,120" class="wire" marker-end="url(#head)"/><rect x="56" y="272" width="150" height="50" rx="6" class="box"/><text x="131" y="293.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">0: strongly not taken</text><text x="131" y="308.5" font-size="11" text-anchor="middle" class="t-ink2">predict not taken</text><rect x="282" y="272" width="150" height="50" rx="6" class="box"/><text x="357" y="293.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">1: weakly not taken</text><text x="357" y="308.5" font-size="11" text-anchor="middle" class="t-ink2">predict not taken</text><path d="M206,288 L282,288" class="wire" marker-end="url(#head)"/><path d="M282,306 L206,306" class="wire" marker-end="url(#head)"/><rect x="508" y="272" width="150" height="50" rx="6" class="box-a"/><text x="583" y="293.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">2: weakly taken</text><text x="583" y="308.5" font-size="11" text-anchor="middle" class="t-ink2">predict taken</text><path d="M432,288 L508,288" class="wire" marker-end="url(#head)"/><path d="M508,306 L432,306" class="wire" marker-end="url(#head)"/><rect x="734" y="272" width="150" height="50" rx="6" class="box-a"/><text x="809" y="293.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">3: strongly taken</text><text x="809" y="308.5" font-size="11" text-anchor="middle" class="t-ink2">predict taken</text><path d="M658,288 L734,288" class="wire" marker-end="url(#head)"/><path d="M734,306 L658,306" class="wire" marker-end="url(#head)"/><text x="690" y="66" font-size="11" text-anchor="start" class="t-muted halo">A loop branch is taken many times,</text><text x="690" y="82" font-size="11" text-anchor="start" class="t-muted halo">then not taken once, at the exit.</text><text x="690" y="98" font-size="11" text-anchor="start" class="t-muted halo">That moves the counter from 3 to 2:</text><text x="690" y="114" font-size="11" text-anchor="start" class="t-muted halo">the next run starts predicted right.</text><text x="410" y="178" font-size="11" text-anchor="start" class="t-ink2 halo">taken: count up, store the target</text><text x="410" y="194" font-size="11" text-anchor="start" class="t-ink2 halo">not taken: count down</text><text x="410" y="210" font-size="11" text-anchor="start" class="t-ink2 halo">taken and no entry: take one over, counter at 3</text><text x="244" y="282" font-size="11" text-anchor="middle" class="t-ink2 halo">taken</text><text x="244" y="320" font-size="11" text-anchor="middle" class="t-ink2 halo">not taken</text><text x="470" y="282" font-size="11" text-anchor="middle" class="t-ink2 halo">taken</text><text x="470" y="320" font-size="11" text-anchor="middle" class="t-ink2 halo">not taken</text><text x="696" y="282" font-size="11" text-anchor="middle" class="t-ink2 halo">taken</text><text x="696" y="320" font-size="11" text-anchor="middle" class="t-ink2 halo">not taken</text></g></svg>
