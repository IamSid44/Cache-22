<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 481" width="980" height="481" class="chart" role="img" aria-label="How every run is checked"><style>.chart{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--n:#898781;--box:#f3f2ee;--tint:#e4eefb;--band:#f8f7f4;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#0d366b;font-family:system-ui, -apple-system, "Segoe UI", sans-serif}@media (prefers-color-scheme:dark){.chart{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--n:#898781;--box:#262624;--tint:#172a44;--band:#1f1f1e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#86b6ef;--o5:#cde2fb;}}.bg{fill:var(--surface)}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.mark{stroke:var(--ink2);stroke-width:1}.ring{stroke:var(--surface);stroke-width:2}.box{fill:var(--box);stroke:var(--axis);stroke-width:1}.box-a{fill:var(--tint);stroke:var(--s1);stroke-width:1.5}.band{fill:var(--band);stroke:var(--grid);stroke-width:1}.wire{stroke:var(--ink2);stroke-width:1.5;fill:none;stroke-linejoin:round}.bus{stroke:var(--s1);stroke-width:3;fill:none}.head{fill:var(--ink2)}.head-a{fill:var(--s1)}.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}.t-ink{fill:var(--ink)}.t-ink2{fill:var(--ink2)}.t-muted{fill:var(--muted)}.f-n{fill:var(--n)}.k-n{stroke:var(--n);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s5{fill:var(--s5)}.k-s5{stroke:var(--s5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s6{fill:var(--s6)}.k-s6{stroke:var(--s6);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s7{fill:var(--s7)}.k-s7{stroke:var(--s7);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s8{fill:var(--s8)}.k-s8{stroke:var(--s8);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o1{fill:var(--o1)}.k-o1{stroke:var(--o1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o2{fill:var(--o2)}.k-o2{stroke:var(--o2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o3{fill:var(--o3)}.k-o3{stroke:var(--o3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o4{fill:var(--o4)}.k-o4{stroke:var(--o4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o5{fill:var(--o5)}.k-o5{stroke:var(--o5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="8" class="bg"/><text x="20" y="33" font-size="15" text-anchor="start" class="t-ink" font-weight="600">How every run is checked</text><text x="20" y="55" font-size="12" text-anchor="start" class="t-ink2">Correctness is defined once, by the golden model. What its trace cannot see (which line a cache evicts, whether two caches agree) gets a second reference.</text><g transform="translate(20,69)"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head"/></marker><marker id="head-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head-a"/></marker></defs><rect x="20" y="110" width="150" height="96" rx="6" class="box"/><text x="95" y="139.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">A program</text><text x="95" y="154.5" font-size="11" text-anchor="middle" class="t-ink2">directed test,</text><text x="95" y="169.5" font-size="11" text-anchor="middle" class="t-ink2">kernel, or random</text><text x="95" y="184.5" font-size="11" text-anchor="middle" class="t-ink2">(built to hit hazards)</text><rect x="240" y="50" width="200" height="70" rx="6" class="box"/><text x="340" y="74" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Golden model</text><text x="340" y="89" font-size="11" text-anchor="middle" class="t-ink2">one instruction at a time;</text><text x="340" y="104" font-size="11" text-anchor="middle" class="t-ink2">no pipeline, no caches</text><rect x="240" y="196" width="200" height="86" rx="6" class="box-a"/><text x="340" y="220.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">The RTL, in simulation</text><text x="340" y="235.5" font-size="11" text-anchor="middle" class="t-ink2">3 cores, 30+ machines:</text><text x="340" y="250.5" font-size="11" text-anchor="middle" class="t-ink2">odd caches, random latency,</text><text x="340" y="265.5" font-size="11" text-anchor="middle" class="t-ink2">garbage predictions</text><path d="M170,140 L205,140 L205,85 L240,85" class="wire" marker-end="url(#head)"/><path d="M170,176 L205,176 L205,239 L240,239" class="wire" marker-end="url(#head)"/><rect x="560" y="30" width="200" height="66" rx="6" class="box"/><text x="660" y="52" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Commit trace</text><text x="660" y="67" font-size="11" text-anchor="middle" class="t-ink2">every instruction, register</text><text x="660" y="82" font-size="11" text-anchor="middle" class="t-ink2">write and store: identical</text><rect x="560" y="114" width="200" height="66" rx="6" class="box"/><text x="660" y="143.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Final memory image</text><text x="660" y="158.5" font-size="11" text-anchor="middle" class="t-ink2">every byte: identical</text><rect x="560" y="198" width="200" height="66" rx="6" class="box"/><text x="660" y="220" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Cache model</text><text x="660" y="235" font-size="11" text-anchor="middle" class="t-ink2">replays each cache's log;</text><text x="660" y="250" font-size="11" text-anchor="middle" class="t-ink2">every decision must agree</text><rect x="560" y="282" width="200" height="66" rx="6" class="box"/><text x="660" y="304" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Checks inside the RTL</text><text x="660" y="319" font-size="11" text-anchor="middle" class="t-ink2">inclusion, fairness: hold</text><text x="660" y="334" font-size="11" text-anchor="middle" class="t-ink2">in every cycle</text><path d="M440,85 L500,85 L500,63 L560,63" class="wire" marker-end="url(#head)"/><path d="M440,220 L520,220 L520,75 L560,75" class="wire" marker-end="url(#head)"/><path d="M440,85 L500,85 L500,147 L560,147" class="wire" marker-end="url(#head)"/><path d="M440,220 L520,220 L520,159 L560,159" class="wire" marker-end="url(#head)"/><path d="M440,258 L520,258 L520,231 L560,231" class="wire" marker-end="url(#head)"/><path d="M440,258 L520,258 L520,315 L560,315" class="wire" marker-end="url(#head)"/><rect x="800" y="110" width="124" height="150" rx="6" class="box"/><text x="862" y="151.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Mutation check</text><text x="862" y="166.5" font-size="11" text-anchor="middle" class="t-ink2">198 bugs planted</text><text x="862" y="181.5" font-size="11" text-anchor="middle" class="t-ink2">in the RTL,</text><text x="862" y="196.5" font-size="11" text-anchor="middle" class="t-ink2">one at a time.</text><text x="862" y="211.5" font-size="11" text-anchor="middle" class="t-ink2">Each must make</text><text x="862" y="226.5" font-size="11" text-anchor="middle" class="t-ink2">a check fail.</text><path d="M862,260 L862,376 L340,376 L340,282" class="wire" marker-end="url(#head)"/><path d="M760,185 L800,185" class="wire" marker-end="url(#head)"/><text x="600" y="370" font-size="11" text-anchor="middle" class="t-ink2 halo">plants a bug</text><text x="780" y="177" font-size="11" text-anchor="middle" class="t-ink2 halo">fails?</text></g></svg>
