<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 445" width="980" height="445" class="chart" role="img" aria-label="The memory hierarchy, and what a load costs at each level"><style>.chart{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--n:#898781;--box:#f3f2ee;--tint:#e4eefb;--band:#f8f7f4;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#0d366b;font-family:system-ui, -apple-system, "Segoe UI", sans-serif}@media (prefers-color-scheme:dark){.chart{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--n:#898781;--box:#262624;--tint:#172a44;--band:#1f1f1e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#86b6ef;--o5:#cde2fb;}}.bg{fill:var(--surface)}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.mark{stroke:var(--ink2);stroke-width:1}.ring{stroke:var(--surface);stroke-width:2}.box{fill:var(--box);stroke:var(--axis);stroke-width:1}.box-a{fill:var(--tint);stroke:var(--s1);stroke-width:1.5}.band{fill:var(--band);stroke:var(--grid);stroke-width:1}.wire{stroke:var(--ink2);stroke-width:1.5;fill:none;stroke-linejoin:round}.bus{stroke:var(--s1);stroke-width:3;fill:none}.head{fill:var(--ink2)}.head-a{fill:var(--s1)}.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}.t-ink{fill:var(--ink)}.t-ink2{fill:var(--ink2)}.t-muted{fill:var(--muted)}.f-n{fill:var(--n)}.k-n{stroke:var(--n);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s5{fill:var(--s5)}.k-s5{stroke:var(--s5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s6{fill:var(--s6)}.k-s6{stroke:var(--s6);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s7{fill:var(--s7)}.k-s7{stroke:var(--s7);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s8{fill:var(--s8)}.k-s8{stroke:var(--s8);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o1{fill:var(--o1)}.k-o1{stroke:var(--o1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o2{fill:var(--o2)}.k-o2{stroke:var(--o2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o3{fill:var(--o3)}.k-o3{stroke:var(--o3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o4{fill:var(--o4)}.k-o4{stroke:var(--o4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o5{fill:var(--o5)}.k-o5{stroke:var(--o5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="8" class="bg"/><text x="20" y="33" font-size="15" text-anchor="start" class="t-ink" font-weight="600">The memory hierarchy, and what a load costs at each level</text><text x="20" y="55" font-size="12" text-anchor="start" class="t-ink2">One cache module is used three times. Every choice in it is a parameter, so each can be measured against the others on the same machine.</text><g transform="translate(20,69)"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head"/></marker><marker id="head-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head-a"/></marker></defs><rect x="20" y="70" width="110" height="190" rx="6" class="box"/><text x="75" y="124" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Core</text><text x="75" y="139" font-size="11" text-anchor="middle" class="t-ink2">fetch port</text><text x="75" y="154" font-size="11" text-anchor="middle" class="t-ink2"></text><text x="75" y="169" font-size="11" text-anchor="middle" class="t-ink2"></text><text x="75" y="184" font-size="11" text-anchor="middle" class="t-ink2"></text><text x="75" y="199" font-size="11" text-anchor="middle" class="t-ink2"></text><text x="75" y="214" font-size="11" text-anchor="middle" class="t-ink2">data port</text><rect x="190" y="70" width="190" height="70" rx="6" class="box-a"/><text x="285" y="94" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Instruction cache</text><text x="285" y="109" font-size="11" text-anchor="middle" class="t-ink2">1 KiB</text><text x="285" y="124" font-size="11" text-anchor="middle" class="t-ink2">next-line prefetcher</text><rect x="190" y="170" width="190" height="90" rx="6" class="box-a"/><text x="285" y="196.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Data cache</text><text x="285" y="211.5" font-size="11" text-anchor="middle" class="t-ink2">1 KiB; 4 replacement policies</text><text x="285" y="226.5" font-size="11" text-anchor="middle" class="t-ink2">write-back or write-through</text><text x="285" y="241.5" font-size="11" text-anchor="middle" class="t-ink2">write buffer, victim buffer</text><path d="M130,105 L190,105" class="wire" marker-end="url(#head)"/><path d="M130,215 L190,215" class="wire" marker-end="url(#head)"/><rect x="440" y="140" width="90" height="50" rx="6" class="box"/><text x="485" y="161.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Arbiter</text><text x="485" y="176.5" font-size="11" text-anchor="middle" class="t-ink2">one at a time</text><path d="M380,105 L410,105 L410,155 L440,155" class="wire" marker-end="url(#head)"/><path d="M380,215 L410,215 L410,175 L440,175" class="wire" marker-end="url(#head)"/><rect x="590" y="120" width="150" height="90" rx="6" class="box-a"/><text x="665" y="146.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Second-level cache</text><text x="665" y="161.5" font-size="11" text-anchor="middle" class="t-ink2">8 KiB, shared</text><text x="665" y="176.5" font-size="11" text-anchor="middle" class="t-ink2">the same module</text><text x="665" y="191.5" font-size="11" text-anchor="middle" class="t-ink2">inclusive or not</text><path d="M530,165 L590,165" class="wire" marker-end="url(#head)"/><rect x="800" y="120" width="120" height="90" rx="6" class="box"/><text x="860" y="146.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Memory</text><text x="860" y="161.5" font-size="11" text-anchor="middle" class="t-ink2">64 KiB</text><text x="860" y="176.5" font-size="11" text-anchor="middle" class="t-ink2">50 cycles</text><text x="860" y="191.5" font-size="11" text-anchor="middle" class="t-ink2">per line</text><path d="M740,165 L800,165" class="wire" marker-end="url(#head)"/><path d="M690,120 L690,40 L285,40 L285,70" class="wire" marker-end="url(#head)"/><path d="M640,210 L640,286 L285,286 L285,260" class="wire" marker-end="url(#head)"/><text x="488" y="33" font-size="11" text-anchor="middle" class="t-ink2 halo">if inclusive: takes a line back from above before evicting it</text><text x="285" y="322" font-size="13" text-anchor="middle" class="t-ink halo" font-weight="600">1 cycle</text><text x="285" y="340" font-size="11" text-anchor="middle" class="t-muted halo">line in the data cache</text><text x="665" y="322" font-size="13" text-anchor="middle" class="t-ink halo" font-weight="600">7 cycles</text><text x="665" y="340" font-size="11" text-anchor="middle" class="t-muted halo">line in the second level</text><text x="860" y="322" font-size="13" text-anchor="middle" class="t-ink halo" font-weight="600">59 cycles</text><text x="860" y="340" font-size="11" text-anchor="middle" class="t-muted halo">line in memory</text></g></svg>
