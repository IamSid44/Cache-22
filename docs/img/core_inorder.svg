<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 445" width="940" height="445" class="chart" role="img" aria-label="The in-order core: five stages"><style>.chart{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--n:#898781;--box:#f3f2ee;--tint:#e4eefb;--band:#f8f7f4;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#0d366b;font-family:system-ui, -apple-system, "Segoe UI", sans-serif}@media (prefers-color-scheme:dark){.chart{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--n:#898781;--box:#262624;--tint:#172a44;--band:#1f1f1e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#86b6ef;--o5:#cde2fb;}}.bg{fill:var(--surface)}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.mark{stroke:var(--ink2);stroke-width:1}.ring{stroke:var(--surface);stroke-width:2}.box{fill:var(--box);stroke:var(--axis);stroke-width:1}.box-a{fill:var(--tint);stroke:var(--s1);stroke-width:1.5}.band{fill:var(--band);stroke:var(--grid);stroke-width:1}.wire{stroke:var(--ink2);stroke-width:1.5;fill:none;stroke-linejoin:round}.bus{stroke:var(--s1);stroke-width:3;fill:none}.head{fill:var(--ink2)}.head-a{fill:var(--s1)}.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}.t-ink{fill:var(--ink)}.t-ink2{fill:var(--ink2)}.t-muted{fill:var(--muted)}.f-n{fill:var(--n)}.k-n{stroke:var(--n);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s5{fill:var(--s5)}.k-s5{stroke:var(--s5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s6{fill:var(--s6)}.k-s6{stroke:var(--s6);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s7{fill:var(--s7)}.k-s7{stroke:var(--s7);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s8{fill:var(--s8)}.k-s8{stroke:var(--s8);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o1{fill:var(--o1)}.k-o1{stroke:var(--o1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o2{fill:var(--o2)}.k-o2{stroke:var(--o2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o3{fill:var(--o3)}.k-o3{stroke:var(--o3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o4{fill:var(--o4)}.k-o4{stroke:var(--o4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o5{fill:var(--o5)}.k-o5{stroke:var(--o5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="8" class="bg"/><text x="20" y="33" font-size="15" text-anchor="start" class="t-ink" font-weight="600">The in-order core: five stages</text><text x="20" y="55" font-size="12" text-anchor="start" class="t-ink2">Only MEM and WB change architectural state, and they are the last two stages. Precise exceptions rest on that.</text><g transform="translate(20,69)"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head"/></marker><marker id="head-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head-a"/></marker></defs><rect x="30" y="120" width="140" height="60" rx="6" class="box"/><text x="100" y="146.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">IF</text><text x="100" y="161.5" font-size="11" text-anchor="middle" class="t-ink2">fetch</text><rect x="206" y="120" width="140" height="60" rx="6" class="box"/><text x="276" y="146.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">ID</text><text x="276" y="161.5" font-size="11" text-anchor="middle" class="t-ink2">decode, read registers</text><path d="M170,150 L206,150" class="wire" marker-end="url(#head)"/><rect x="382" y="120" width="140" height="60" rx="6" class="box-a"/><text x="452" y="146.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">EX</text><text x="452" y="161.5" font-size="11" text-anchor="middle" class="t-ink2">ALU, decide branches</text><path d="M346,150 L382,150" class="wire" marker-end="url(#head)"/><rect x="558" y="120" width="140" height="60" rx="6" class="box-a"/><text x="628" y="146.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">MEM</text><text x="628" y="161.5" font-size="11" text-anchor="middle" class="t-ink2">load, store, CSRs, traps</text><path d="M522,150 L558,150" class="wire" marker-end="url(#head)"/><rect x="734" y="120" width="140" height="60" rx="6" class="box"/><text x="804" y="146.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">WB</text><text x="804" y="161.5" font-size="11" text-anchor="middle" class="t-ink2">write register</text><path d="M698,150 L734,150" class="wire" marker-end="url(#head)"/><path d="M608,120 L608,96 L482,96 L482,120" class="wire" marker-end="url(#head)"/><path d="M784,120 L784,80 L452,80 L452,120" class="wire" marker-end="url(#head)"/><rect x="30" y="20" width="140" height="50" rx="6" class="box"/><text x="100" y="41.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Branch predictor</text><text x="100" y="56.5" font-size="11" text-anchor="middle" class="t-ink2">BTB + 2-bit counters</text><path d="M70,70 L70,120" class="wire" marker-end="url(#head)"/><path d="M412,120 L412,45 L170,45" class="wire" marker-end="url(#head)"/><path d="M452,180 L452,222 L130,222 L130,180" class="wire" marker-end="url(#head)"/><path d="M598,180 L598,262 L100,262 L100,180" class="wire" marker-end="url(#head)"/><rect x="20" y="300" width="120" height="44" rx="6" class="box"/><text x="80" y="326" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Instruction cache</text><path d="M55,180 L55,300" class="wire" marker-end="url(#head)"/><rect x="618" y="300" width="120" height="44" rx="6" class="box"/><text x="678" y="326" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Data cache</text><path d="M668,180 L668,300" class="wire" marker-end="url(#head)"/><text x="804" y="202" font-size="11" text-anchor="middle" class="t-muted halo">commit report:</text><text x="804" y="217" font-size="11" text-anchor="middle" class="t-muted halo">one line per instruction</text><text x="638" y="72" font-size="11" text-anchor="middle" class="t-ink2 halo">forward results to EX: no cycles lost</text><text x="78" y="100" font-size="11" text-anchor="start" class="t-ink2 halo">next pc</text><text x="266" y="38" font-size="11" text-anchor="middle" class="t-ink2 halo">train with what really happened</text><text x="256" y="238" font-size="11" text-anchor="middle" class="t-ink2 halo">fetch went the wrong way: redirect, 2 instructions squashed</text><text x="402" y="278" font-size="11" text-anchor="middle" class="t-ink2 halo">trap or mret, taken in MEM: 3 instructions squashed</text><text x="148" y="326" font-size="11" text-anchor="start" class="t-muted halo">miss: IF sends bubbles</text><text x="746" y="326" font-size="11" text-anchor="start" class="t-muted halo">miss: every stage holds</text></g></svg>
