<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 481" width="980" height="481" class="chart" role="img" aria-label="The whole machine"><style>.chart{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--n:#898781;--box:#f3f2ee;--tint:#e4eefb;--band:#f8f7f4;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#0d366b;font-family:system-ui, -apple-system, "Segoe UI", sans-serif}@media (prefers-color-scheme:dark){.chart{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--n:#898781;--box:#262624;--tint:#172a44;--band:#1f1f1e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#86b6ef;--o5:#cde2fb;}}.bg{fill:var(--surface)}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.mark{stroke:var(--ink2);stroke-width:1}.ring{stroke:var(--surface);stroke-width:2}.box{fill:var(--box);stroke:var(--axis);stroke-width:1}.box-a{fill:var(--tint);stroke:var(--s1);stroke-width:1.5}.band{fill:var(--band);stroke:var(--grid);stroke-width:1}.wire{stroke:var(--ink2);stroke-width:1.5;fill:none;stroke-linejoin:round}.bus{stroke:var(--s1);stroke-width:3;fill:none}.head{fill:var(--ink2)}.head-a{fill:var(--s1)}.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}.t-ink{fill:var(--ink)}.t-ink2{fill:var(--ink2)}.t-muted{fill:var(--muted)}.f-n{fill:var(--n)}.k-n{stroke:var(--n);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s5{fill:var(--s5)}.k-s5{stroke:var(--s5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s6{fill:var(--s6)}.k-s6{stroke:var(--s6);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s7{fill:var(--s7)}.k-s7{stroke:var(--s7);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s8{fill:var(--s8)}.k-s8{stroke:var(--s8);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o1{fill:var(--o1)}.k-o1{stroke:var(--o1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o2{fill:var(--o2)}.k-o2{stroke:var(--o2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o3{fill:var(--o3)}.k-o3{stroke:var(--o3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o4{fill:var(--o4)}.k-o4{stroke:var(--o4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o5{fill:var(--o5)}.k-o5{stroke:var(--o5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="8" class="bg"/><text x="20" y="33" font-size="15" text-anchor="start" class="t-ink" font-weight="600">The whole machine</text><text x="20" y="55" font-size="12" text-anchor="start" class="t-ink2">Either core plugs into the same memory system, and everything in it is a parameter: sizes, ways, policies, buffers, the second level, memory latency.</text><g transform="translate(20,69)"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head"/></marker><marker id="head-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" class="head-a"/></marker></defs><rect x="290" y="284" width="420" height="92" rx="8" class="band"/><text x="300" y="300" font-size="11" text-anchor="start" class="t-muted">written by every run, for the checks</text><rect x="730" y="16" width="190" height="254" rx="8" class="band"/><text x="740" y="32" font-size="11" text-anchor="start" class="t-muted">the testbench: tb/</text><rect x="20" y="16" width="690" height="254" rx="8" class="band"/><text x="30" y="32" font-size="11" text-anchor="start" class="t-muted">the processor: rtl/</text><rect x="40" y="44" width="200" height="46" rx="6" class="box"/><text x="140" y="63.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Branch predictor</text><text x="140" y="78.5" font-size="11" text-anchor="middle" class="t-ink2">64-entry BTB, 2-bit counters</text><rect x="40" y="110" width="200" height="150" rx="6" class="box-a"/><text x="140" y="151.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Core</text><text x="140" y="166.5" font-size="11" text-anchor="middle" class="t-ink2">in-order, 5 stages</text><text x="140" y="181.5" font-size="11" text-anchor="middle" class="t-ink2">or</text><text x="140" y="196.5" font-size="11" text-anchor="middle" class="t-ink2">out-of-order, 1 or 2 wide</text><text x="140" y="211.5" font-size="11" text-anchor="middle" class="t-ink2"></text><text x="140" y="226.5" font-size="11" text-anchor="middle" class="t-ink2">RV64I, precise traps</text><path d="M140,90 L140,110" class="wire" marker-end="url(#head)"/><rect x="310" y="96" width="170" height="56" rx="6" class="box"/><text x="395" y="120.5" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Instruction cache</text><text x="395" y="135.5" font-size="11" text-anchor="middle" class="t-ink2">next-line prefetcher</text><rect x="310" y="186" width="170" height="74" rx="6" class="box"/><text x="395" y="212" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Data cache</text><text x="395" y="227" font-size="11" text-anchor="middle" class="t-ink2">prefetcher, write buffer,</text><text x="395" y="242" font-size="11" text-anchor="middle" class="t-ink2">victim buffer</text><path d="M240,124 L310,124" class="wire" marker-end="url(#head)"/><path d="M240,223 L310,223" class="wire" marker-end="url(#head)"/><rect x="540" y="140" width="150" height="76" rx="6" class="box"/><text x="615" y="167" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Second-level cache</text><text x="615" y="182" font-size="11" text-anchor="middle" class="t-ink2">optional, shared,</text><text x="615" y="197" font-size="11" text-anchor="middle" class="t-ink2">inclusive or not</text><path d="M480,124 L510,124 L510,165 L540,165" class="wire" marker-end="url(#head)"/><path d="M480,223 L510,223 L510,191 L540,191" class="wire" marker-end="url(#head)"/><rect x="750" y="140" width="150" height="76" rx="6" class="box"/><text x="825" y="167" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Memory</text><text x="825" y="182" font-size="11" text-anchor="middle" class="t-ink2">64 KiB,</text><text x="825" y="197" font-size="11" text-anchor="middle" class="t-ink2">10 or 50 cycles per line</text><path d="M690,178 L750,178" class="wire" marker-end="url(#head)"/><rect x="310" y="312" width="170" height="54" rx="6" class="box"/><text x="395" y="328" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Commit trace</text><text x="395" y="343" font-size="11" text-anchor="middle" class="t-ink2">compared with the</text><text x="395" y="358" font-size="11" text-anchor="middle" class="t-ink2">golden model</text><rect x="540" y="312" width="150" height="54" rx="6" class="box"/><text x="615" y="328" font-size="12" text-anchor="middle" class="t-ink" font-weight="600">Cache event logs</text><text x="615" y="343" font-size="11" text-anchor="middle" class="t-ink2">replayed by the</text><text x="615" y="358" font-size="11" text-anchor="middle" class="t-ink2">cache model</text><path d="M140,260 L140,339 L310,339" class="wire" marker-end="url(#head)"/><path d="M440,260 L440,276 L600,276 L600,312" class="wire" marker-end="url(#head)"/><path d="M640,216 L640,312" class="wire" marker-end="url(#head)"/><text x="275" y="118" font-size="11" text-anchor="middle" class="t-ink2 halo">fetch</text><text x="275" y="217" font-size="11" text-anchor="middle" class="t-ink2 halo">load, store</text><text x="222" y="332" font-size="11" text-anchor="middle" class="t-ink2 halo">commit report</text></g></svg>
