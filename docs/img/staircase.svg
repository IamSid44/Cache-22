<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 472" width="820" height="472" class="chart" role="img" aria-label="The staircase: what a load costs as the working set grows"><style>.chart{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--n:#898781;--box:#f3f2ee;--tint:#e4eefb;--band:#f8f7f4;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#0d366b;font-family:system-ui, -apple-system, "Segoe UI", sans-serif}@media (prefers-color-scheme:dark){.chart{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--n:#898781;--box:#262624;--tint:#172a44;--band:#1f1f1e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#86b6ef;--o5:#cde2fb;}}.bg{fill:var(--surface)}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.mark{stroke:var(--ink2);stroke-width:1}.ring{stroke:var(--surface);stroke-width:2}.box{fill:var(--box);stroke:var(--axis);stroke-width:1}.box-a{fill:var(--tint);stroke:var(--s1);stroke-width:1.5}.band{fill:var(--band);stroke:var(--grid);stroke-width:1}.wire{stroke:var(--ink2);stroke-width:1.5;fill:none;stroke-linejoin:round}.bus{stroke:var(--s1);stroke-width:3;fill:none}.head{fill:var(--ink2)}.head-a{fill:var(--s1)}.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}.t-ink{fill:var(--ink)}.t-ink2{fill:var(--ink2)}.t-muted{fill:var(--muted)}.f-n{fill:var(--n)}.k-n{stroke:var(--n);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s5{fill:var(--s5)}.k-s5{stroke:var(--s5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s6{fill:var(--s6)}.k-s6{stroke:var(--s6);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s7{fill:var(--s7)}.k-s7{stroke:var(--s7);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-s8{fill:var(--s8)}.k-s8{stroke:var(--s8);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o1{fill:var(--o1)}.k-o1{stroke:var(--o1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o2{fill:var(--o2)}.k-o2{stroke:var(--o2);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o3{fill:var(--o3)}.k-o3{stroke:var(--o3);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o4{fill:var(--o4)}.k-o4{stroke:var(--o4);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.f-o5{fill:var(--o5)}.k-o5{stroke:var(--o5);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="8" class="bg"/><text x="20" y="33" font-size="15" text-anchor="start" class="t-ink" font-weight="600">The staircase: what a load costs as the working set grows</text><text x="20" y="55" font-size="12" text-anchor="start" class="t-ink2">One loop reads a working set of each size round and round. A load costs 1 cycle while the set fits the 1 KiB data cache,</text><text x="20" y="72" font-size="12" text-anchor="start" class="t-ink2">7 while it fits the 8 KiB second level, and 59 when it has to come from memory, 50 cycles away.</text><path d="M20,91 H36" class="k-s1"/><circle cx="28" cy="91" r="3.5" class="f-s1 ring"/><text x="42" y="95" font-size="12" text-anchor="start" class="t-ink2">first-level caches only</text><path d="M214.6,91 H230.6" class="k-s2"/><circle cx="222.6" cy="91" r="3.5" class="f-s2 ring"/><text x="236.6" y="95" font-size="12" text-anchor="start" class="t-ink2">with an 8 KiB second-level cache</text><path d="M469.6,91 H485.6" class="k-s3"/><circle cx="477.6" cy="91" r="3.5" class="f-s3 ring"/><text x="491.6" y="95" font-size="12" text-anchor="start" class="t-ink2">the same, inclusive</text><g transform="translate(20,112)"><text x="0" y="16" font-size="11" text-anchor="start" class="t-muted">Cycles per load</text><text x="397.2" y="336" font-size="11" text-anchor="middle" class="t-muted">Working set</text><line x1="22.3" x2="770" y1="300" y2="300" class="axis"/><text x="16.3" y="304" font-size="11" text-anchor="end" class="t-muted">0</text><line x1="22.3" x2="770" y1="231" y2="231" class="grid"/><text x="16.3" y="235" font-size="11" text-anchor="end" class="t-muted">20</text><line x1="22.3" x2="770" y1="162" y2="162" class="grid"/><text x="16.3" y="166" font-size="11" text-anchor="end" class="t-muted">40</text><line x1="22.3" x2="770" y1="93" y2="93" class="grid"/><text x="16.3" y="97" font-size="11" text-anchor="end" class="t-muted">60</text><line x1="22.3" x2="770" y1="24" y2="24" class="grid"/><text x="16.3" y="28" font-size="11" text-anchor="end" class="t-muted">80</text><text x="34.3" y="316" font-size="11" text-anchor="middle" class="t-muted">256 B</text><text x="137.7" y="316" font-size="11" text-anchor="middle" class="t-muted">512 B</text><text x="241.1" y="316" font-size="11" text-anchor="middle" class="t-muted">1 KiB</text><text x="344.5" y="316" font-size="11" text-anchor="middle" class="t-muted">2 KiB</text><text x="447.9" y="316" font-size="11" text-anchor="middle" class="t-muted">4 KiB</text><text x="551.2" y="316" font-size="11" text-anchor="middle" class="t-muted">8 KiB</text><text x="654.6" y="316" font-size="11" text-anchor="middle" class="t-muted">16 KiB</text><text x="758" y="316" font-size="11" text-anchor="middle" class="t-muted">32 KiB</text><path d="M34.3,296.6 L137.7,296.6 L241.1,296.6 L344.5,117.2 L447.9,117.2 L551.2,117.2 L654.6,117.2 L758,117.2" class="k-s1"/><circle cx="34.3" cy="296.6" r="3.5" class="f-s1 ring"><title>first-level caches only, 256 B: 1</title></circle><circle cx="137.7" cy="296.6" r="3.5" class="f-s1 ring"><title>first-level caches only, 512 B: 1</title></circle><circle cx="241.1" cy="296.6" r="3.5" class="f-s1 ring"><title>first-level caches only, 1 KiB: 1</title></circle><circle cx="344.5" cy="117.2" r="3.5" class="f-s1 ring"><title>first-level caches only, 2 KiB: 53</title></circle><circle cx="447.9" cy="117.2" r="3.5" class="f-s1 ring"><title>first-level caches only, 4 KiB: 53</title></circle><circle cx="551.2" cy="117.2" r="3.5" class="f-s1 ring"><title>first-level caches only, 8 KiB: 53</title></circle><circle cx="654.6" cy="117.2" r="3.5" class="f-s1 ring"><title>first-level caches only, 16 KiB: 53</title></circle><circle cx="758" cy="117.2" r="3.5" class="f-s1 ring"><title>first-level caches only, 32 KiB: 53</title></circle><path d="M34.3,296.6 L137.7,296.6 L241.1,296.6 L344.5,275.9 L447.9,275.9 L551.2,275.9 L654.6,96.4 L758,96.4" class="k-s2"/><circle cx="34.3" cy="296.6" r="3.5" class="f-s2 ring"><title>with an 8 KiB second-level cache, 256 B: 1</title></circle><circle cx="137.7" cy="296.6" r="3.5" class="f-s2 ring"><title>with an 8 KiB second-level cache, 512 B: 1</title></circle><circle cx="241.1" cy="296.6" r="3.5" class="f-s2 ring"><title>with an 8 KiB second-level cache, 1 KiB: 1</title></circle><circle cx="344.5" cy="275.9" r="3.5" class="f-s2 ring"><title>with an 8 KiB second-level cache, 2 KiB: 7</title></circle><circle cx="447.9" cy="275.9" r="3.5" class="f-s2 ring"><title>with an 8 KiB second-level cache, 4 KiB: 7</title></circle><circle cx="551.2" cy="275.9" r="3.5" class="f-s2 ring"><title>with an 8 KiB second-level cache, 8 KiB: 7</title></circle><circle cx="654.6" cy="96.4" r="3.5" class="f-s2 ring"><title>with an 8 KiB second-level cache, 16 KiB: 59</title></circle><circle cx="758" cy="96.4" r="3.5" class="f-s2 ring"><title>with an 8 KiB second-level cache, 32 KiB: 59</title></circle><path d="M34.3,296.6 L137.7,296.6 L241.1,296.6 L344.5,275.9 L447.9,275.9 L551.2,270 L654.6,89.6 L758,89.6" class="k-s3"/><circle cx="34.3" cy="296.6" r="3.5" class="f-s3 ring"><title>the same, inclusive, 256 B: 1</title></circle><circle cx="137.7" cy="296.6" r="3.5" class="f-s3 ring"><title>the same, inclusive, 512 B: 1</title></circle><circle cx="241.1" cy="296.6" r="3.5" class="f-s3 ring"><title>the same, inclusive, 1 KiB: 1</title></circle><circle cx="344.5" cy="275.9" r="3.5" class="f-s3 ring"><title>the same, inclusive, 2 KiB: 7</title></circle><circle cx="447.9" cy="275.9" r="3.5" class="f-s3 ring"><title>the same, inclusive, 4 KiB: 7</title></circle><circle cx="551.2" cy="270" r="3.5" class="f-s3 ring"><title>the same, inclusive, 8 KiB: 9</title></circle><circle cx="654.6" cy="89.6" r="3.5" class="f-s3 ring"><title>the same, inclusive, 16 KiB: 61</title></circle><circle cx="758" cy="89.6" r="3.5" class="f-s3 ring"><title>the same, inclusive, 32 KiB: 61</title></circle></g></svg>
